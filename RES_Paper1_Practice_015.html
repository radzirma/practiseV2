ders protecting his interest pending completion. Grace asks what rights remain while the mortgage exists.", "marks": 2}, {"topic": "Mortgage & Caveat", "q": "What may protect Imran's equitable interest pending completion where appropriate? Apply only the facts stated in Case Study A.", "options": ["A caveat", "A TOL", "A sublease", "An easement"], "answer": 0, "explanation": "An exercised OTP buyer may have a caveatable equitable interest.", "case": "CASE STUDY A — Practice 015\nGrace owns a property subject to a registered legal mortgage. Buyer Imran later exercises an OTP and his solicitor considers protecting his interest pending completion. Grace asks what rights remain while the mortgage exists.", "marks": 2}, {"topic": "Succession & Co-ownership", "q": "What happens to Aisha's interest in Property X? Apply only the facts stated in Case Study B.", "options": ["It accrues to Bella by survivorship", "It necessarily passes to her son", "It becomes State land", "It becomes a mortgage"], "answer": 0, "explanation": "An unsevered joint tenancy carries survivorship.", "case": "CASE STUDY B — Practice 015\nAisha and Bella own Property X as joint tenants. Aisha signs a will leaving 'my share' to her son but dies without severing the joint tenancy. Their uncle separately dies leaving a valid will appointing an executor for Property Y.", "marks": 2}, {"topic": "Succession & Co-ownership", "q": "If they had been tenants in common, which would be true? Apply only the facts stated in Case Study B.", "options": ["Aisha's distinct undivided share could pass through her estate", "Bella automatically takes all", "Neither has a proprietary interest", "Their shares must be equal"], "answer": 0, "explanation": "Tenants in common have distinct undivided shares.", "case": "CASE STUDY B — Practice 015\nAisha and Bella own Property X as joint tenants. Aisha signs a will leaving 'my share' to her son but dies without severing the joint tenancy. Their uncle separately dies leaving a valid will appointing an executor for Property Y.", "marks": 2}, {"topic": "Succession & Co-ownership", "q": "The uncle's estate devolves by: Apply only the facts stated in Case Study B.", "options": ["Testate succession", "Intestate succession", "Adverse possession", "Novation"], "answer": 0, "explanation": "A valid will means testate succession.", "case": "CASE STUDY B — Practice 015\nAisha and Bella own Property X as joint tenants. Aisha signs a will leaving 'my share' to her son but dies without severing the joint tenancy. Their uncle separately dies leaving a valid will appointing an executor for Property Y.", "marks": 2}, {"topic": "Succession & Co-ownership", "q": "Which document is associated with the executor's authority? Apply only the facts stated in Case Study B.", "options": ["Grant of probate", "Letters of administration", "TOL", "OTP"], "answer": 0, "explanation": "Grant of probate is associated with an executor.", "case": "CASE STUDY B — Practice 015\nAisha and Bella own Property X as joint tenants. Aisha signs a will leaving 'my share' to her son but dies without severing the joint tenancy. Their uncle separately dies leaving a valid will appointing an executor for Property Y.", "marks": 2}],MAX=28;let Q=[],i=0,s=0,t0=0,tm;const $=x=>document.getElementById(x);
