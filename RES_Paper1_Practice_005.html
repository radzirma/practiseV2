ply relative to demand.", "q": "Before any contract is signed, During a transaction briefing, a client raises this point: Why can scarcity support values in a tightly limited housing segment? Which answer should the salesperson give?", "case": null, "marks": 1}, {"topic": "Market", "stem": "Why is real-estate supply often relatively inelastic in the short run?", "options": ["Development requires time, approvals and construction", "Land is personal property", "Demand is legally fixed", "Mortgages prohibit development"], "answer": 0, "explanation": "New property supply takes time to produce.", "q": "Before any contract is signed, During a transaction briefing, a client raises this point: Why is real-estate supply often relatively inelastic in the short run? Which answer should the salesperson give?", "case": null, "marks": 1}, {"topic": "Planning & Market", "q": "Ignoring other controls, what potential GFA is indicated? Apply only the facts stated in Case Study A.", "options": ["2,700 sq m", "1125 sq m", "468.8 sq m", "1,127.4 sq m"], "answer": 0, "explanation": "Potential GFA = site area × plot ratio.", "case": "CASE STUDY A — Practice 005\nA developer studies a 1125 sq m site with plot ratio 2.4. The Master Plan shows a broad zoning, but the premises have an existing approved use. Financing costs have risen and the developer is considering a change of use without major structural works.", "marks": 2}, {"topic": "Planning & Market", "q": "Which statement is most accurate? Apply only the facts stated in Case Study A.", "options": ["Zoning gives broad planning intention while approved use concerns the specific premises", "Zoning and approved use are necessarily identical", "Approved use determines title ownership", "Zoning determines mortgage priority"], "answer": 0, "explanation": "The notes distinguish zoning from approved use.", "case": "CASE STUDY A — Practice 005\nA developer studies a 1125 sq m site with plot ratio 2.4. The Master Plan shows a broad zoning, but t t to Leon. A custom shelving system is bolted to the walls. Nadia wants to remove it although it was shown during viewing. Leon makes an offer identifying parties, property and price. Nadia says she accepts only if completion is postponed by two months.", "marks": 2}],MAX=28;let Q=[],i=0,s=0,t0=0,tm;const $=x=>document.getElementById(x);
