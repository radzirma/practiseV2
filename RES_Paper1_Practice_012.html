sarily", "Mortgage"], "answer": 0, "explanation": "A sublease leaves the tenant with a reversion.", "q": "While reviewing the transaction, Four trainees disagree. Apply the Paper 1 principle: A tenant grants another person a shorter term while retaining the balance. This is generally what? Choose the BEST answer.", "case": null, "marks": 1}, {"topic": "Landlord & Tenant", "stem": "Which combination best identifies essential features of a lease in the notes?", "options": ["Exclusive possession, certainty of term and intention to create a lease", "Market value, caveat and mortgage", "Plot ratio, zoning and title search", "Gift, trust and succession"], "answer": 0, "explanation": "The notes identify exclusive possession, certainty of term and intention.", "q": "While reviewing the transaction, Four trainees disagree. Apply the Paper 1 principle: Which combination best identifies essential features of a lease in the notes? Choose the BEST answer.", "case": null, "marks": 1}, {"topic": "Trust & Gift", "q": "The proposed transfer of Property A is most closely: Apply only the facts stated in Case Study A.", "options": ["A gift", "A mortgage", "A lease", "An easement"], "answer": 0, "explanation": "A gratuitous transfer is a gift.", "case": "CASE STUDY A — Practice 012\nMr Tan wants to transfer Property A to his daughter without receiving a purchase price. He also owns Property B as trustee for two beneficiaries. A buyer of Property B is told only that Mr Tan's name appears on title.", "marks": 2}, {"topic": "Trust & Gift", "q": "Why might insolvency law matter to the gift? Apply only the facts stated in Case Study A.", "options": ["Certain dispositions may be vulnerable to challenge", "Every gift becomes a lease", "Gifts are never affected by creditors", "Insolvency creates freehold title"], "answer": 0, "explanation": "The syllabus includes insolvency effects on gifts.", "case": "CASE STUDY A — Practice 012\nMr Tan wants to transfer Property A to his daughter without receiving a purchase price. He also owns Property B as trustee for two beneficiaries. A buyer of Property B is told only that Mr Tan's name appears on title.", "marks": 2}, {"topic": "Trust & Gift", "q": "For Property B, Mr Tan generally holds: Apply only the facts stated in Case Study A.", "options": ["Legal title as trustee", "Only a personal licence", "A mortgage automatically", "No interest"], "answer": 0, "explanation": "A trustee may hold legal title.", "case": "CASE STUDY A — Practice 012\nMr Tan wants to transfer Property A to his daughter without receiving a purchase price. He also owns Property B as trustee for two beneficiaries. A buyer of Property B is told only that Mr Tan's name appears on title.", "marks": 2}, {"topic": "Trust & Gift", "q": "What else should the buyer investigate? Apply only the facts stated in Case Study A.", "options": ["Beneficial interests and Mr Tan's authority to deal", "Only postal code", "Only furniture", "Only asking price"], "answer": 0, "explanation": "A buyer should consider beneficial interests and authority.", "case": "CASE STUDY A — Practice 012\nMr Tan wants to transfer Property A to his daughter without receiving a purchase price. He also owns Property B as trustee for two beneficiaries. A buyer of Property B is told only that Mr Tan's name appears on title.", "marks": 2}, {"topic": "Easement & Title", "q": "Lot 10 is the: Apply only the facts stated in Case Study B.", "options": ["Dominant tenement", "Servient tenement", "Reversion", "Mortgagee"], "answer": 0, "explanation": "The dominant land enjoys the easement.", "case": "CASE STUDY B — Practice 012\nLot 10 cannot conveniently reach the road except over a path on Lot 11. A legally recognised right of way benefits Lot 10. Lot 11's title also contains a restrictive covenant and a registered mortgage.", "marks": 2}, {"topic": "Easement & Title", "q": "Lot 11 is the: Apply only the facts stated in Case Study B.", "options": ["Servient tenement", "Dominant tenement", "Remainder", "Caveator"], "answer": 0, "explanation": "The servient land bears the easement.", "case": "CASE STUDY B — Practice 012\nLot 10 cannot conveniently reach the road except over a path on Lot 11. A legally recognised right of way benefits Lot 10. Lot 11's title also contains a restrictive covenant and a registered mortgage.", "marks": 2}, {"topic": "Easement & Title", "q": "The right of way is best classified as: Apply only the facts stated in Case Study B.", "options": ["An easement", "A lease", "A mortgage", "A fixture"], "answer": 0, "explanation": "A right of way is a classic easement.", "case": "CASE STUDY B — Practice 012\nLot 10 cannot conveniently reach the road except over a path on Lot 11. A legally recognised right of way benefits Lot 10. Lot 11's title also contains a restrictive covenant and a registered mortgage.", "marks": 2}, {"topic": "Easement & Title", "q": "The mortgage and restrictive covenant may: Apply only the facts stated in Case Study B.", "options": ["Affect or encumber title", "Convert leasehold to freehold", "Make land movable", "Automatically extinguish the easement"], "answer": 0, "explanation": "Both may affect title.", "case": "CASE STUDY B — Practice 012\nLot 10 cannot conveniently reach the road except over a path on Lot 11. A legally recognised right of way benefits Lot 10. Lot 11's title also contains a restrictive covenant and a registered mortgage.", "marks": 2}],MAX=28;let Q=[],i=0,s=0,t0=0,tm;const $=x=>document.getElementById(x);
